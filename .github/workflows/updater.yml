name: Verify updater

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test updater and build production JAR
        shell: bash
        run: ./gradlew updaterTest jar --no-daemon
