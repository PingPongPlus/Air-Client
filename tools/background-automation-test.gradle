import groovy.json.JsonOutput
import groovy.json.JsonSlurper

allprojects {
    afterEvaluate {
        loom.runs.configureEach {
            programArguments.set(programArguments.get().findAll { !['--quickPlayMultiplayer', 'hypixel.net'].contains(it) })
        }
        if (project == rootProject) {
            tasks.named('processGametestResources') {
                outputs.upToDateWhen { false }
                doLast {
                    def file = new File(destinationDir, 'fabric.mod.json')
                    def data = new JsonSlurper().parse(file)
                    data.entrypoints['fabric-client-gametest'] = ['pingplus.voicechat.client.BackgroundAutomationGameTest']
                    file.text = JsonOutput.prettyPrint(JsonOutput.toJson(data))
                }
            }
        }
        tasks.configureEach {
            if (name == 'runClientGameTest') jvmArgs '-Dairclient.updater.disable=true'
        }
    }
}
