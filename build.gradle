plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "voicechat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        named("client") {
            // Auto-join Hypixel on start (like SkyHanni) for live testing.
            programArguments.addAll("--quickPlayMultiplayer", "hypixel.net")
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
    configureTests {
        createSourceSet = true
        modId = 'voicechat-glass-test'
        enableGameTests = false
        clearRunDirectory = false
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    exclusiveContent {
        forRepository {
            flatDir {
                name = 'bundledBaritone'
                dirs 'libs'
            }
        }
        filter { includeModule('local.baritone', 'baritone-api-fabric') }
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://api.modrinth.com/maven' }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.azureaaron.net/releases" }
        }
        filter {
            includeGroupAndSubgroups("net.azureaaron")
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Clean glowing outline wie SkyHanni (CustomGlowCallback)
    implementation "net.azureaaron:render-chest:1.0.3+26.2"
    include "net.azureaaron:render-chest:1.0.3+26.2"
    // SkyCofl (sky.coflnet.com auction house frontend)
    implementation include("com.github.Coflnet:CoflSkyCore:3406a83b4a")
    implementation include("org.greenrobot:eventbus-java:3.3.1")
    implementation include("org.java-websocket:Java-WebSocket:1.5.2")
    implementation include("com.google.code.gson:gson:2.10.1")
    implementation include("com.neovisionaries:nv-websocket-client:2.14")
    implementation include("maven.modrinth:yacl:3.9.4+26.2-fabric")
    // Keep Baritone's own Fabric metadata and nested native runtime intact.
    implementation include('local.baritone:baritone-api-fabric:1.19.0')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

sourceSets {
    voiceTest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
tasks.register('voiceSmokeTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.VoiceRuntimeSmokeTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('check') { dependsOn 'voiceSmokeTest' }

tasks.register('spotifySmokeTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.spotify.SpotifyPlaybackTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'spotifySmokeTest' }

tasks.register('musicGlassSmokeTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.spotify.MusicGlassTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'musicGlassSmokeTest' }

tasks.register('aimSmoothingTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.AimSmoothingTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'aimSmoothingTest' }

tasks.register('damageGlassSmokeTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.DamageGlassTimingTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'damageGlassSmokeTest' }

tasks.register('weatherGlassTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.WeatherGlassTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'weatherGlassTest' }

tasks.register('hudMetricsTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.HudMetricsTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'hudMetricsTest' }


jar {
    from("LICENSE_SkyCofl")
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
