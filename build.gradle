plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "voicechat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
    configureTests {
        createSourceSet = true
        modId = 'voicechat-glass-test'
        enableGameTests = false
        clearRunDirectory = false
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

// Only the standalone protocol and Opus runtime are reused; no old Minecraft classes.
def suppliedVoiceJar = providers.gradleProperty('voicechatJar').orElse('libs/voicechat.jar')
tasks.register('voiceRuntime', Jar) {
    archiveFileName = 'laby-voice-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('voice-runtime')
    from({
        def source = file(suppliedVoiceJar.get())
        if (!source.isFile()) throw new GradleException('Supply the original JAR with -PvoicechatJar=/path/to/voicechat.jar')
        zipTree(source)
    }) {
        include 'net/labymod/voice/**', 'net/labymod/opus/**', 'native-binaries/**'
    }
}
dependencies {
    implementation files(tasks.named('voiceRuntime'))
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

sourceSets {
    voiceTest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
tasks.register('voiceSmokeTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.VoiceRuntimeSmokeTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('check') { dependsOn 'voiceSmokeTest' }

tasks.register('spotifySmokeTest', JavaExec) {
    dependsOn voiceTestClasses, clientClasses
    classpath = sourceSets.voiceTest.runtimeClasspath
    mainClass = 'pingplus.voicechat.client.spotify.SpotifyPlaybackTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn 'spotifySmokeTest' }

jar {
    from({ zipTree(tasks.named('voiceRuntime').get().archiveFile.get().asFile) })
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
